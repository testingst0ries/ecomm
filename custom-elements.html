<body>

    <h1>User Portal Demo</h1>
    <p>
        Real-world example using Custom Elements + Shadow DOM + Nested Components.
    </p>

    <user-portal username="Chandan"></user-portal>

    <script>
        /* ==========================================
           CHILD COMPONENT #1
           Notification Badge
        ========================================== */
        class NotificationBadge extends HTMLElement {
            constructor() {
                super();

                const shadow = this.attachShadow({ mode: "open" });
                const count = this.getAttribute("count") || "0";

                shadow.innerHTML = `
      <style>
        .badge {
          background: #dc3545;
          color: white;
          font-size: 12px;
          font-weight: bold;
          padding: 5px 9px;
          border-radius: 50px;
          min-width: 22px;
          text-align: center;
          display: inline-block;
        }
      </style>

      <span class="badge">${count}</span>
    `;
            }
        }

        customElements.define("notification-badge", NotificationBadge);


        /* ==========================================
           CHILD COMPONENT #2
           User Menu Card
        ========================================== */
        class UserMenu extends HTMLElement {
            constructor() {
                super();

                const shadow = this.attachShadow({ mode: "open" });

                shadow.innerHTML = `
      <style>
        ul {
          list-style: none;
          padding: 0;
          margin: 0;
        }

        li {
          padding: 10px 0;
          border-bottom: 1px solid #eee;
          cursor: pointer;
        }

        li:last-child {
          border-bottom: none;
        }

        li:hover {
          color: #007bff;
        }
      </style>

      <ul>
        <li>Dashboard</li>
        <li>Orders</li>
        <li>Profile</li>
        <li>Logout</li>
      </ul>
    `;
            }
        }

        customElements.define("user-menu", UserMenu);


        /* ==========================================
           PARENT COMPONENT
           Uses Nested Child Components
        ========================================== */
        class UserPortal extends HTMLElement {
            constructor() {
                super();

                const shadow = this.attachShadow({ mode: "open" });
                const username = this.getAttribute("username") || "Guest";

                shadow.innerHTML = `
      <style>
        .portal {
          max-width: 700px;
          background: white;
          border-radius: 14px;
          overflow: hidden;
          box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .header {
          background: #1e293b;
          color: white;
          padding: 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .body {
          display: grid;
          grid-template-columns: 220px 1fr;
          min-height: 320px;
        }

        .sidebar {
          border-right: 1px solid #eee;
          padding: 20px;
        }

        .content {
          padding: 20px;
        }

        .card {
          background: #f8fafc;
          padding: 18px;
          border-radius: 12px;
          margin-bottom: 15px;
        }

        h2, h3 {
          margin-top: 0;
        }
      </style>

      <div class="portal">

        <div class="header">
          <div>Welcome, ${username}</div>

          <!-- Nested child element -->
          <notification-badge count="5"></notification-badge>
        </div>

        <div class="body">

          <div class="sidebar">
            <!-- Nested child element -->
            <user-menu></user-menu>
          </div>

          <div class="content">
            <div class="card">
              <h3>Account Summary</h3>
              <p>Membership: Premium</p>
              <p>Last Login: Today</p>
            </div>

            <div class="card">
              <h3>Recent Activity</h3>
              <p>✔ Order placed</p>
              <p>✔ Password updated</p>
            </div>
          </div>

        </div>

      </div>
    `;
            }
        }

        customElements.define("user-portal", UserPortal);
    </script>

</body>

</html>
